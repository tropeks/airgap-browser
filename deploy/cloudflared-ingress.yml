# Snippet for the cloudflared ingress (e.g. /etc/cloudflared/config.yml), before the
# catch-all `- service: http_status:404`. Replace qp.example.com with your hostname and
# the ports with QP_REMOTE_PORT and QP_PORT from your .env.
# Order matters: the rule with a path goes before the general rule for the same hostname.
# With Cloudflare Access, a single app covers the whole hostname (both rules).
  - hostname: qp.example.com
    path: ^/remoto(/|$)
    service: http://localhost:18085
  - hostname: qp.example.com
    service: http://localhost:18082
