# Portão do modo remoto com tela (Selkies). Único ponto que liga a rede interna
# do navegador ao host: o proxy da frente (túnel ou reverse proxy) manda <seu domínio>/remoto/* para cá, e daqui
# só se chega ao Selkies. Roda sem root (user 101) e com sistema de arquivos só leitura.
worker_processes 1;
pid /tmp/nginx.pid;
error_log /dev/stderr warn;

events { worker_connections 256; }

http {
    access_log off;
    client_body_temp_path /tmp/client_body;
    proxy_temp_path /tmp/proxy;
    fastcgi_temp_path /tmp/fastcgi;
    uwsgi_temp_path /tmp/uwsgi;
    scgi_temp_path /tmp/scgi;
    server_tokens off;
    client_max_body_size 1m;

    map $http_upgrade $connection_upgrade {
        default upgrade;
        ''      close;
    }

    # Outro site aberto no seu navegador não pode abrir o WebSocket do Selkies
    # pegando carona no seu login (cookie do Access ou senha do navegador):
    # cross-site WebSocket hijacking. Só passa Origin vazio ou igual ao próprio
    # Host da requisição (mesma origem), então não há domínio fixo para configurar.
    # O proxy da frente precisa manter o Host original (o cloudflared mantém).
    map "$http_origin|$http_host" $origem_estranha {
        "~^\|"                          0;
        "~^https?://([^|/]+)\|\1$"       0;
        default                          1;
    }

    server {
        listen 8080;

        # Vale para todas as rotas abaixo (inclusive os downloads).
        if ($origem_estranha) { return 403; }

        location = /remoto { return 301 /remoto/; }

        location /remoto/ {
            # O Selkies roda com SUBFOLDER=/remoto/, então o caminho segue inteiro.
            proxy_pass http://navegador:3000;
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection $connection_upgrade;
            proxy_set_header Host $host;
            proxy_set_header X-Forwarded-For $http_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto https;
            proxy_buffering off;
            proxy_read_timeout 1d;
            proxy_send_timeout 1d;
        }

        # Downloads do painel "Arquivos" do Selkies (o que o Chromium remoto salvou).
        # São arquivos não confiáveis servidos no domínio do QP: um .html baixado
        # não pode rodar script com a origem do QP (e daí abrir o WebSocket
        # do Selkies ou chamar o app). O Selkies já manda "attachment"; aqui
        # o portão garante sandbox (origem opaca) e nosniff mesmo assim.
        # allow-scripts: a listagem usa JS próprio; allow-downloads: o clique baixa.
        location ~ ^/remoto/api/(files|file-manager)/ {
            limit_except GET { deny all; }
            proxy_pass http://navegador:3000;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Forwarded-For $http_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto https;
            proxy_buffering off;
            proxy_read_timeout 1h;
            proxy_hide_header Content-Security-Policy;
            add_header Content-Security-Policy "sandbox allow-scripts allow-downloads; default-src 'none'; style-src 'unsafe-inline'; script-src 'unsafe-inline'; img-src data:" always;
            add_header X-Content-Type-Options nosniff always;
            add_header Cross-Origin-Resource-Policy same-origin always;
            add_header Cache-Control "no-store" always;
        }

        location / { return 404; }
    }
}
