[project]
name = "safebrowse"
version = "0.1.0"
license = "MIT"
description = "Navegador isolado: proxy sanitizador estilo Surfola para abrir páginas potencialmente inseguras"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "lxml>=5.2",
    "tinycss2>=1.3",
    "httpx[http2]>=0.27",
    "playwright>=1.50",
    "selectolax>=1.0.2",
]

[dependency-groups]
dev = [
    "pytest>=8",
    "pytest-asyncio>=0.24",
    "ruff>=0.6",
]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
markers = ["remote: precisa de Chromium (playwright install chromium)"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]
ignore = ["SIM117", "E501", "SIM105"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["app"]
